name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 💅 Lint code
        run: pnpm run lint

      - name: 🧪 Run tests
        run: pnpm run test
